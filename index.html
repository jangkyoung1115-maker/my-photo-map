<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광명, 기억의 흔적</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Kakao Map API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=bd83a6ca29e1fbf4fa5da49d88125054"></script>
    <!-- exifr (GPS 및 촬영 날짜 추출) -->
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; }

        .header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px; border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 10px;
        }
        .header h1 { font-size: 16px; color: #1e293b; font-weight: bold; }
        .upload-btn {
            background: #2563eb; color: white; border: none;
            padding: 8px 14px; border-radius: 20px; font-size: 13px;
            cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .upload-btn:hover { background: #1d4ed8; }

        .select-notice {
            display: none; position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: #ef4444; color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px;
            width: 100%; max-width: 400px; text-align: center;
            max-height: 90vh; overflow-y: auto;
        }
        .modal img { max-width: 100%; max-height: 250px; border-radius: 8px; object-fit: contain; margin-bottom: 10px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
        }
        .date-badge {
            display: inline-block; background: #e0f2fe; color: #0369a1;
            font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: bold; margin-bottom: 10px;
        }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn-group button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-submit { background: #2563eb; color: white; }
        .btn-edit { background: #059669; color: white; }
        .btn-delete { background: #dc2626; color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }

        .info-window { padding: 8px; text-align: center; max-width: 180px; }
        .info-window img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin-bottom: 5px; cursor: pointer; }
        .info-window .date { font-size: 11px; color: #0284c7; font-weight: bold; }
        .info-window .desc { font-size: 12px; color: #334155; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📍 광명, 기억의 흔적</h1>
        <button class="upload-btn" onclick="triggerFileInput()">+ 사진 올리기</button>
    </div>

    <div id="selectNotice" class="select-notice">📍 지도에서 사진이 찍힌 위치를 클릭해 주세요!</div>

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

    <div id="map"></div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">사진 정보 입력</h3>
            <img id="previewImage" src="" alt="미리보기">
            <div id="dateBadge" class="date-badge"></div>
            <p id="locationNotice" style="font-size: 12px; color: #2563eb; margin-bottom: 10px;"></p>
            
            <div class="input-group" id="descGroup">
                <label>설명</label>
                <textarea id="photoDesc" rows="3" placeholder="사진에 대한 추억이나 설명을 적어주세요."></textarea>
            </div>
            <div class="input-group" id="pinGroup">
                <label id="pinLabel">비밀번호 (숫자 4자리)</label>
                <input type="password" id="photoPin" maxlength="4" placeholder="숫자 4자리">
            </div>

            <div class="btn-group">
                <button class="btn-cancel" onclick="closeModal()">닫기</button>
                <button class="btn-submit" id="btnSubmit" onclick="submitPhoto()">등록하기</button>
                <button class="btn-edit" id="btnEdit" style="display:none;" onclick="updatePhoto()">수정</button>
                <button class="btn-delete" id="btnDelete" style="display:none;" onclick="deletePhoto()">삭제</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Firebase 설정 ---
        const firebaseConfig = {
  apiKey: "AIzaSyCcSiUm1HhfHXLVRiP2fUmDFALGUDgYzZY",
  authDomain: "gwangmyeong-photos.firebaseapp.com",
  databaseURL: "https://gwangmyeong-photos-default-rtdb.firebaseio.com",
  projectId: "gwangmyeong-photos",
  storageBucket: "gwangmyeong-photos.firebasestorage.app",
  messagingSenderId: "660236513672",
  appId: "1:660236513672:web:7e3e0d36a6c07951b8ca3d"
};
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        let map, currentLat, currentLng, selectedImageData, formattedDate;
        let isWaitingForLocationClick = false;
        let tempMarker = null;
        let currentPhotoId = null;
        let currentPhotoPin = null;
        const markers = {};

        // --- 2. Kakao Map 초기화 ---
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.4786, 126.8644),
            level: 5
        };
        map = new kakao.maps.Map(container, options);
        map.setMaxLevel(7);

        const gwangmyeongBounds = new kakao.maps.LatLngBounds(
            new kakao.maps.LatLng(37.4000, 126.8000),
            new kakao.maps.LatLng(37.5300, 126.9300)
        );

        kakao.maps.event.addListener(map, 'dragend', function() {
            const center = map.getCenter();
            if (!gwangmyeongBounds.contain(center)) {
                map.panTo(new kakao.maps.LatLng(37.4786, 126.8644));
            }
        });

        // --- 3. Firebase 실시간 데이터 동기화 ---
        database.ref('photos').on('value', (snapshot) => {
            Object.values(markers).forEach(m => m.setMap(null));
            
            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                const item = data[id];
                const pos = new kakao.maps.LatLng(item.lat, item.lng);
                const marker = new kakao.maps.Marker({ position: pos, map: map });
                
                markers[id] = marker;

                const iwContent = `
                    <div class="info-window">
                        <img src="${item.imageUrl}" onclick="openDetailModal('${id}')">
                        <div class="date">${item.date}</div>
                        <div class="desc">${item.desc || ''}</div>
                    </div>
                `;
                const infowindow = new kakao.maps.InfoWindow({ content: iwContent, removable: true });

                kakao.maps.event.addListener(marker, 'click', function() {
                    infowindow.open(map, marker);
                });
            });
        });

        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            if (!isWaitingForLocationClick) return;

            const latlng = mouseEvent.latLng;
            currentLat = latlng.getLat();
            currentLng = latlng.getLng();

            if (tempMarker) tempMarker.setMap(null);
            tempMarker = new kakao.maps.Marker({ position: latlng });
            tempMarker.setMap(map);

            isWaitingForLocationClick = false;
            document.getElementById('selectNotice').style.display = 'none';
            document.getElementById('locationNotice').innerText = "📍 지정하신 위치로 등록됩니다.";
            
            setModalMode('upload');
            document.getElementById('uploadModal').style.display = 'flex';
        });

        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        // 이미지 파일 리사이징 (압축) 함수
        function resizeImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 이미지를 800px 크기로 압축하여 고속 저장 가능하게 변경
            selectedImageData = await resizeImage(file, 800, 800, 0.7);
            document.getElementById('previewImage').src = selectedImageData;

            try {
                const exifrData = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
                const photoDate = exifrData?.DateTimeOriginal || exifrData?.CreateDate;
                if (photoDate) {
                    const d = new Date(photoDate);
                    formattedDate = `촬영일: ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
                } else {
                    const today = new Date();
                    formattedDate = `등록일: ${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
                }
            } catch {
                const today = new Date();
                formattedDate = `등록일: ${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
            }
            document.getElementById('dateBadge').innerText = formattedDate;

            try {
                const gps = await exifr.gps(file);
                if (gps && gps.latitude && gps.longitude) {
                    currentLat = gps.latitude;
                    currentLng = gps.longitude;
                    document.getElementById('locationNotice').innerText = "✅ 사진의 위치 정보를 확인했습니다.";
                    setModalMode('upload');
                    document.getElementById('uploadModal').style.display = 'flex';
                } else {
                    startLocationSelectMode();
                }
            } catch {
                startLocationSelectMode();
            }
        }

        function startLocationSelectMode() {
            isWaitingForLocationClick = true;
            document.getElementById('selectNotice').style.display = 'block';
            alert("사진에 위치 정보가 없습니다.\n확인을 누르신 후, 지도의 정확한 위치를 클릭해 주세요!");
        }

        function setModalMode(mode) {
            const btnSubmit = document.getElementById('btnSubmit');
            const btnEdit = document.getElementById('btnEdit');
            const btnDelete = document.getElementById('btnDelete');
            const photoDesc = document.getElementById('photoDesc');
            const photoPin = document.getElementById('photoPin');

            if (mode === 'upload') {
                document.getElementById('modalTitle').innerText = "사진 정보 입력";
                photoDesc.readOnly = false;
                photoPin.value = "";
                document.getElementById('pinLabel').innerText = "비밀번호 (숫자 4자리)";
                btnSubmit.style.display = "block";
                btnEdit.style.display = "none";
                btnDelete.style.display = "none";
            } else if (mode === 'detail') {
                document.getElementById('modalTitle').innerText = "사진 상세보기";
                photoDesc.readOnly = false;
                photoPin.value = "";
                document.getElementById('pinLabel').innerText = "비밀번호 입력 (수정/삭제 시 필요)";
                btnSubmit.style.display = "none";
                btnEdit.style.display = "block";
                btnDelete.style.display = "block";
            }
        }

        function openDetailModal(id) {
            currentPhotoId = id;
            database.ref('photos/' + id).once('value', (snapshot) => {
                const item = snapshot.val();
                if (!item) return;

                currentPhotoPin = item.pin;
                document.getElementById('previewImage').src = item.imageUrl;
                document.getElementById('dateBadge').innerText = item.date;
                document.getElementById('photoDesc').value = item.desc || "";
                document.getElementById('locationNotice').innerText = "";

                setModalMode('detail');
                document.getElementById('uploadModal').style.display = 'flex';
            });
        }

        function closeModal() {
            document.getElementById('uploadModal').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('photoDesc').value = '';
            document.getElementById('photoPin').value = '';
            if (tempMarker) tempMarker.setMap(null);
            isWaitingForLocationClick = false;
            document.getElementById('selectNotice').style.display = 'none';
        }

        function submitPhoto() {
            const pin = document.getElementById('photoPin').value;
            const desc = document.getElementById('photoDesc').value;

            if (!pin || pin.length < 4) {
                alert("비밀번호(PIN) 4자리를 정확히 입력해 주세요.");
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "저장 중...";

            const newPhotoRef = database.ref('photos').push();
            newPhotoRef.set({
                lat: currentLat,
                lng: currentLng,
                imageUrl: selectedImageData,
                date: formattedDate,
                desc: desc,
                pin: pin
            }, (error) => {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "등록하기";
                if (error) {
                    alert("저장 실패: " + error.message);
                } else {
                    alert("성공적으로 영구 아카이브에 저장되었습니다!");
                    closeModal();
                }
            });
        }

        function updatePhoto() {
            const inputPin = document.getElementById('photoPin').value;
            const newDesc = document.getElementById('photoDesc').value;

            if (inputPin !== currentPhotoPin) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            database.ref('photos/' + currentPhotoId).update({
                desc: newDesc
            }, (error) => {
                if (error) {
                    alert("수정 실패: " + error.message);
                } else {
                    alert("설명이 성공적으로 수정되었습니다.");
                    closeModal();
                }
            });
        }

        function deletePhoto() {
            const inputPin = document.getElementById('photoPin').value;

            if (inputPin !== currentPhotoPin) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            if (confirm("정말로 이 사진을 삭제하시겠습니까?")) {
                database.ref('photos/' + currentPhotoId).remove((error) => {
                    if (error) {
                        alert("삭제 실패: " + error.message);
                    } else {
                        alert("사진이 삭제되었습니다.");
                        closeModal();
                    }
                });
            }
        }
    </script>
</body>
</html>
