<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>광명, 기억의 흔적</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Kakao Map API (발급받은 JavaScript 키를 입력하세요) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=bd83a6ca29e1fbf4fa5da49d88125054"></script>
    <!-- exifr (GPS 및 촬영 날짜 추출 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; }

        .header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(255, 255, 255, 0.95);
            padding: 10px 20px; border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 10px;
        }
        .header h1 { font-size: 16px; color: #1e293b; font-weight: bold; }
        .upload-btn {
            background: #2563eb; color: white; border: none;
            padding: 8px 14px; border-radius: 20px; font-size: 13px;
            cursor: pointer; font-weight: bold; transition: background 0.2s;
        }
        .upload-btn:hover { background: #1d4ed8; }

        /* 지도 위 위치 선택 안내 배너 */
        .select-notice {
            display: none; position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: #ef4444; color: white;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 모달 스타일 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px;
            width: 100%; max-width: 400px; text-align: center;
            max-height: 90vh; overflow-y: auto;
        }
        .modal img { max-width: 100%; max-height: 250px; border-radius: 8px; object-fit: contain; margin-bottom: 10px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
        }
        .date-badge {
            display: inline-block; background: #e0f2fe; color: #0369a1;
            font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: bold; margin-bottom: 10px;
        }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-group button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-submit { background: #2563eb; color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }

        /* 지도 마커 팝업 스타일 */
        .info-window { padding: 10px; text-align: center; max-width: 200px; }
        .info-window img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 5px; cursor: pointer; }
        .info-window .date { font-size: 11px; color: #0284c7; font-weight: bold; }
        .info-window .desc { font-size: 12px; color: #334155; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📍 광명, 기억의 흔적</h1>
        <button class="upload-btn" onclick="triggerFileInput()">+ 사진 올리기</button>
    </div>

    <div id="selectNotice" class="select-notice">📍 지도에서 사진이 찍힌 위치를 클릭해 주세요!</div>

    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">

    <div id="map"></div>

    <!-- 업로드 / 상세보기 모달 창 -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">사진 정보 입력</h3>
            <img id="previewImage" src="" alt="미리보기">
            <div id="dateBadge" class="date-badge"></div>
            <p id="locationNotice" style="font-size: 12px; color: #2563eb; margin-bottom: 10px;"></p>
            <div class="input-group" id="descGroup">
                <label>설명</label>
                <textarea id="photoDesc" rows="3" placeholder="사진에 대한 추억이나 설명을 적어주세요."></textarea>
            </div>
            <div class="input-group" id="pinGroup">
                <label>비밀번호 (수정/삭제용 PIN)</label>
                <input type="password" id="photoPin" maxlength="4" placeholder="숫자 4자리">
            </div>
            <div class="btn-group">
                <button class="btn-cancel" onclick="closeModal()">닫기</button>
                <button class="btn-submit" id="btnSubmit" onclick="submitPhoto()">등록하기</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        let map, currentLat, currentLng, selectedImageData, formattedDate;
        let isWaitingForLocationClick = false;
        let tempMarker = null;

        // 1. 지도 초기화 (광명시 중심)
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.4786, 126.8644), // 광명시청 부근
            level: 5
        };
        map = new kakao.maps.Map(container, options);

        // 2. 지도 축소 범위 제한 (최대 레벨 7로 제한하여 광명시를 크게 벗어나지 않게 설정)
        map.setMaxLevel(7);

        // 3. 광명시 경계 영역 설정 (이 영역 밖으로는 이동 제한)
        const gwangmyeongBounds = new kakao.maps.LatLngBounds(
            new kakao.maps.LatLng(37.4000, 126.8000), // 남서쪽 경계
            new kakao.maps.LatLng(37.5300, 126.9300)  // 북동쪽 경계
        );

        // 지도 이동 시 광명시 범위를 벗어나지 않도록 감지
        kakao.maps.event.addListener(map, 'dragend', function() {
            const center = map.getCenter();
            if (!gwangmyeongBounds.contain(center)) {
                map.panTo(new kakao.maps.LatLng(37.4786, 126.8644)); // 광명시 중심으로 원복
            }
        });

        // 수동 위치 클릭 선택 이벤트
        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            if (!isWaitingForLocationClick) return;

            const latlng = mouseEvent.latLng;
            currentLat = latlng.getLat();
            currentLng = latlng.getLng();

            if (tempMarker) tempMarker.setMap(null);
            tempMarker = new kakao.maps.Marker({ position: latlng });
            tempMarker.setMap(map);

            isWaitingForLocationClick = false;
            document.getElementById('selectNotice').style.display = 'none';
            document.getElementById('locationNotice').innerText = "📍 지정하신 위치로 등록됩니다.";
            
            // 모달 입력 모드 재설정
            setModalMode(true);
            document.getElementById('uploadModal').style.display = 'flex';
        });

        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                selectedImageData = e.target.result;
                document.getElementById('previewImage').src = selectedImageData;

                // 날짜 추출
                try {
                    const exifrData = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
                    const photoDate = exifrData?.DateTimeOriginal || exifrData?.CreateDate;
                    if (photoDate) {
                        const d = new Date(photoDate);
                        formattedDate = `촬영일: ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
                    } else {
                        const today = new Date();
                        formattedDate = `등록일: ${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
                    }
                } catch {
                    const today = new Date();
                    formattedDate = `등록일: ${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
                }
                document.getElementById('dateBadge').innerText = formattedDate;

                // GPS 추출
                try {
                    const gps = await exifr.gps(file);
                    if (gps && gps.latitude && gps.longitude) {
                        currentLat = gps.latitude;
                        currentLng = gps.longitude;
                        document.getElementById('locationNotice').innerText = "✅ 사진의 위치 정보를 확인했습니다.";
                        setModalMode(true);
                        document.getElementById('uploadModal').style.display = 'flex';
                    } else {
                        startLocationSelectMode();
                    }
                } catch {
                    startLocationSelectMode();
                }
            };
            reader.readAsDataURL(file);
        }

        function startLocationSelectMode() {
            isWaitingForLocationClick = true;
            document.getElementById('selectNotice').style.display = 'block';
            alert("사진에 위치 정보가 없습니다.\n확인을 누르신 후, 지도의 정확한 위치를 클릭해 주세요!");
        }

        function setModalMode(isUpload) {
            if (isUpload) {
                document.getElementById('modalTitle').innerText = "사진 정보 입력";
                document.getElementById('descGroup').style.display = "block";
                document.getElementById('pinGroup').style.display = "block";
                document.getElementById('btnSubmit').style.display = "block";
            } else {
                document.getElementById('modalTitle').innerText = "사진 상세보기";
                document.getElementById('descGroup').style.display = "none";
                document.getElementById('pinGroup').style.display = "none";
                document.getElementById('btnSubmit').style.display = "none";
            }
        }

        function closeModal() {
            document.getElementById('uploadModal').style.display = 'none';
            document.getElementById('fileInput').value = '';
            if (tempMarker) tempMarker.setMap(null);
            isWaitingForLocationClick = false;
            document.getElementById('selectNotice').style.display = 'none';
        }

        function submitPhoto() {
            const pin = document.getElementById('photoPin').value;
            const desc = document.getElementById('photoDesc').value;

            if (!pin) {
                alert("비밀번호(PIN)를 입력해 주세요.");
                return;
            }

            const locPosition = new kakao.maps.LatLng(currentLat, currentLng);
            const marker = new kakao.maps.Marker({ position: locPosition });
            marker.setMap(map);

            // 마커 클릭 시 인포윈도우(미리보기) 표시
            const iwContent = `
                <div class="info-window">
                    <img src="${selectedImageData}" onclick="openImageDetail('${selectedImageData}', '${formattedDate}', '${desc}')">
                    <div class="date">${formattedDate}</div>
                    <div class="desc">${desc}</div>
                </div>
            `;
            const infowindow = new kakao.maps.InfoWindow({
                content: iwContent,
                removable: true
            });

            kakao.maps.event.addListener(marker, 'click', function() {
                infowindow.open(map, marker);
            });

            if (tempMarker) tempMarker.setMap(null);
            map.panTo(locPosition);
            alert("사진이 성공적으로 등록되었습니다!");
            closeModal();
        }

        // 마커 및 사진 클릭 시 큰 모달창으로 사진 원본 보기
        function openImageDetail(imgSrc, dateText, descText) {
            document.getElementById('previewImage').src = imgSrc;
            document.getElementById('dateBadge').innerText = dateText;
            document.getElementById('locationNotice').innerText = descText || "";
            setModalMode(false);
            document.getElementById('uploadModal').style.display = 'flex';
        }
    </script>
</body>
</html>
